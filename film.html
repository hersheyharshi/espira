<!-- ═════════════ shared GLSL ═════════════ -->
<script id="common" type="x-shader">
precision highp float;
precision highp sampler2D;
precision highp samplerCube;
const float PI = 3.14159265;
const float R_E = 6371.0;
const float R_A = 6471.0;
const float ALT = 550.0;
const vec3 BR = vec3(5.8e-3, 13.5e-3, 33.1e-3);
const float BM = 7e-3;
const float HR = 8.0, HM = 1.2;
float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y), f.z);
}
float fbm(vec3 p, int oct){
  float a = 0.5, s = 0.0;
  for(int i=0;i<12;i++){ if(i>=oct) break; s += a*vnoise(p); p = p*2.03 + vec3(1.7,9.2,3.1); a *= 0.5; }
  return s;
}
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
vec2 raySphere(vec3 ro, vec3 rd, float r){
  float b = dot(ro, rd), c = dot(ro, ro) - r*r, h = b*b - c;
  if(h < 0.0) return vec2(1e9, -1e9);
  h = sqrt(h); return vec2(-b - h, -b + h);
}
vec2 densities(vec3 p){ float h = max(length(p) - R_E, 0.0); return vec2(exp(-h/HR), exp(-h/HM)); }
</script>

<script id="vs" type="x-shader">#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }
</script>

<!-- ═════════════ bake: Earth surface + clouds into two cube maps (once, at load) ═════════════ -->
<script id="fs_bake" type="x-shader">
uniform int uFace; uniform float uSize;
layout(location=0) out vec4 o0; // rgb albedo, a city lights
layout(location=1) out vec4 o1; // r cloud, g land, b ice
vec3 faceDir(int f, vec2 uv){
  if(f==0) return vec3( 1.0, -uv.y, -uv.x);
  if(f==1) return vec3(-1.0, -uv.y,  uv.x);
  if(f==2) return vec3( uv.x,  1.0,  uv.y);
  if(f==3) return vec3( uv.x, -1.0, -uv.y);
  if(f==4) return vec3( uv.x, -uv.y,  1.0);
  return vec3(-uv.x, -uv.y, -1.0);
}
void main(){
  vec2 uv = (gl_FragCoord.xy / uSize)*2.0 - 1.0;
  vec3 m = normalize(faceDir(uFace, uv));
  vec3 pole = normalize(vec3(0.25, 0.35, 0.9));
  float lat = abs(dot(m, pole));
  vec3 w = vec3(fbm(m*2.3+vec3(4.0), 5), fbm(m*2.3+vec3(9.0), 5), fbm(m*2.3+vec3(17.0), 5));
  float e = fbm(m*1.7 + w*1.1, 11);
  float land = smoothstep(0.515, 0.522, e);
  float coast = smoothstep(0.46, 0.515, e) * (1.0-land);
  float relief = smoothstep(0.53, 0.66, e);
  float moist = fbm(m*5.0 + vec3(3.0), 6);
  vec3 ocean = mix(vec3(0.004,0.018,0.052), vec3(0.01,0.07,0.11), coast*coast);
  vec3 veg = mix(vec3(0.03,0.055,0.022), vec3(0.075,0.085,0.04), moist);
  vec3 desert = mix(vec3(0.36,0.28,0.17), vec3(0.45,0.36,0.24), fbm(m*30.0,3));
  float dry = smoothstep(0.55,0.36, moist) * smoothstep(0.75,0.25, lat);
  vec3 ground = mix(veg, desert, dry);
  ground = mix(ground, vec3(0.16,0.14,0.12), relief*0.5);                  // highlands
  ground *= 0.78 + 0.45*fbm(m*55.0, 5);                                    // fine texture
  float snow = smoothstep(0.62, 0.7, e) * smoothstep(0.3, 0.6, lat);       // mountain snow
  float ice = smoothstep(0.86, 0.9, lat + 0.05*fbm(m*8.0,4));
  vec3 alb = mix(ocean, ground, land);
  alb = mix(alb, vec3(0.7,0.72,0.76), max(ice, snow*0.7));
  // clouds: large systems + streaks + small cumulus
  float sw = fbm(m*1.3 + vec3(2.0), 4);
  vec3 cm = m; cm.xz = rot((sw-0.5)*1.8) * cm.xz;
  float c1 = fbm(cm*4.2 + w*0.7, 9);
  float c2 = fbm(m*vec3(16.0,4.0,16.0) + vec3(5.0), 6);
  float cloud = smoothstep(0.56, 0.74, c1*0.8 + c2*0.25);
  cloud = max(cloud, smoothstep(0.66, 0.76, fbm(m*38.0, 5)) * 0.55 * smoothstep(0.45,0.6,c1));
  cloud *= 0.75 + 0.25*smoothstep(0.2, 0.6, lat);
  // cities: clustered, on coasts and lowlands
  float urban = smoothstep(0.6, 0.78, fbm(m*48.0 + vec3(7.0), 6)) * smoothstep(0.62, 0.52, e);
  float sparkle = pow(hash13(floor(m*2600.0)), 6.0);
  float city = land * (1.0-ice) * (urban*0.7 + sparkle*urban*2.0 + smoothstep(0.8,0.95,fbm(m*140.0,3))*0.15*urban);
  o0 = vec4(alb, clamp(city, 0.0, 1.0));
  o1 = vec4(clamp(cloud,0.0,1.0), land, max(ice,snow), 1.0);
}
</script>

<!-- ═════════════ bake: sun transmittance lookup table ═════════════ -->
<script id="fs_lut" type="x-shader">
in vec2 vUv; out vec4 o;
void main(){
  float mu = -0.6 + 1.6*vUv.x;
  float h = vUv.y*100.0;
  vec3 p = vec3(0.0, R_E + h, 0.0);
  vec3 l = vec3(sqrt(max(1.0-mu*mu,0.0)), mu, 0.0);
  vec2 te = raySphere(p, l, R_E);
  if(te.x > 0.0 && te.x < 1e8){ o = vec4(0.0); return; }
  vec2 ta = raySphere(p, l, R_A);
  float L = ta.y, dt = L/40.0; vec2 od = vec2(0.0);
  for(int i=0;i<40;i++){ od += densities(p + l*(dt*(float(i)+0.5)))*dt; }
  o = vec4(exp(-(BR*od.x + BM*1.1*od.y)), 1.0);
}
</script>

<!-- ═════════════ scene ═════════════ -->
<script id="fs_scene" type="x-shader">
in vec2 vUv; out vec4 fragColor;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uCamPos, uCamFwd, uCamRight, uCamUp; uniform float uFov;
uniform vec3 uSun; uniform vec3 uSunT; uniform float uExposure; uniform int uLDR;
uniform float uDeploy, uWingTilt, uBayOpen;
uniform mat3 uDebRot; uniform vec3 uDebPos; uniform float uDebOn;
uniform vec3 uArmS, uArmE, uArmW;
uniform vec3 uBeamA, uBeamB; uniform float uBeam;
uniform vec3 uFragPos[4]; uniform mat3 uFragRot[4]; uniform float uFragOn[4]; uniform float uFragGlow[4]; uniform float uFragMat[4];
uniform vec3 uUvB; uniform float uUv; uniform vec3 uGrnB; uniform float uGrn;
uniform float uEmit, uFin, uFil, uSkin, uBeacon, uLidar, uDish, uTag, uFilSpark;
uniform vec3 uFilHit; uniform vec3 uFilDir[9];
uniform vec3 uRbPos; uniform mat3 uRbRot; uniform float uRbOn;
uniform vec3 uNetC, uNetA; uniform float uNetR, uNetAng, uNetOn;
uniform float uThrust, uRcs, uAurora, uEarthSpin;
uniform samplerCube uEarthA, uEarthB; uniform sampler2D uLut;

// ───── SDF helpers ─────
float sdBox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r; }
float sdCylY(vec3 p, float r, float h){ vec2 d = vec2(length(p.xz)-r, abs(p.y)-h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }
float sdCylZ(vec3 p, float r, float h){ return sdCylY(p.xzy, r, h); }
float sdCylX(vec3 p, float r, float h){ return sdCylY(p.yxz, r, h); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p-a, ba = b-a; float h = clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa - ba*h) - r; }
float sdTorusZ(vec3 p, float R, float r){ vec2 q = vec2(length(p.xy)-R, p.z); return length(q)-r; }
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }

const float M_GOLD=1., M_SILVER=2., M_WHITE=3., M_BLACK=4., M_METAL=5., M_COPPER=6., M_CELL=7., M_GLASS=8., M_CERAMIC=9., M_DEBFOIL=10., M_DEBCELL=11., M_INTERIOR=12., M_NET=13., M_TETHER=14., M_EMIT=15., M_LIDAR=16., M_BEACON=17., M_ROCKET=18., M_FRAG=20.;

vec2 wing(vec3 p, float side){
  p.x *= side;
  p -= vec3(0.0, 0.15, 0.0);
  p.yz = rot(uWingTilt) * p.yz;
  vec2 res = vec2(sdCylX(p - vec3(0.98,0.0,0.0), 0.07, 0.08), M_METAL);
  res = opU(res, vec2(sdCap(p, vec3(1.0,0.0,0.0), vec3(1.42,0.0, 0.32), 0.012), M_METAL));
  res = opU(res, vec2(sdCap(p, vec3(1.0,0.0,0.0), vec3(1.42,0.0,-0.32), 0.012), M_METAL));
  float th = (1.0 - uDeploy) * 1.5708;
  float W = 1.15;
  vec3 s = vec3(1.42, 0.0, 0.0);
  for(int i=0;i<3;i++){
    float sg = (i==1) ? -1.0 : 1.0;
    vec3 dir = vec3(cos(th), sg*sin(th), 0.0);
    vec3 nrm = vec3(-dir.y, dir.x, 0.0) * sg;
    vec3 c = s + dir*(W*0.5) + nrm*0.02*float(i)*(1.0-uDeploy);
    vec3 q = p - c;
    vec3 lq = vec3(dot(q,dir), dot(q,nrm*sg), q.z);
    res = opU(res, vec2(sdBox(lq, vec3(W*0.5-0.01, 0.014, 0.48), 0.004), M_CELL));
    // frame rails
    res = opU(res, vec2(sdBox(lq - vec3(0.0,0.0, 0.485), vec3(W*0.5-0.01, 0.018, 0.008), 0.002), M_METAL));
    res = opU(res, vec2(sdBox(lq - vec3(0.0,0.0,-0.485), vec3(W*0.5-0.01, 0.018, 0.008), 0.002), M_METAL));
    s += dir*W;
  }
  return res;
}

vec2 craft(vec3 p){
  float bs = length(p) - 6.4;
  if(bs > 0.5) return vec2(bs, 0.0);
  // bus with the collection bay carved into the lower front face
  float bus = sdBox(p, vec3(0.9,0.7,0.75), 0.03);
  float hole = sdBox(p - vec3(0.0,-0.42,0.75), vec3(0.3,0.17,0.32), 0.01);
  vec2 res = (-hole > bus) ? vec2(-hole, M_INTERIOR) : vec2(bus, M_GOLD);
  // bay door slides sideways on rails
  res = opU(res, vec2(sdBox(p - vec3(0.0 + uBayOpen*0.62, -0.42, 0.79), vec3(0.31,0.18,0.012), 0.004), M_METAL));
  res = opU(res, vec2(sdBox(p - vec3(0.31,-0.21,0.79), vec3(0.62,0.012,0.012), 0.003), M_METAL));
  res = opU(res, vec2(sdBox(p - vec3(0.31,-0.63,0.79), vec3(0.62,0.012,0.012), 0.003), M_METAL));
  res = opU(res, vec2(sdBox(p - vec3(0.0, 0.705,0.0), vec3(0.78,0.008,0.6), 0.002), M_WHITE));
  res = opU(res, vec2(sdBox(p - vec3(0.0,-0.705,0.0), vec3(0.78,0.008,0.6), 0.002), M_WHITE));
  vec3 ap = vec3(abs(p.x), abs(p.y), p.z);
  res = opU(res, vec2(sdBox(ap - vec3(0.9,0.7,0.0), vec3(0.022,0.022,0.77), 0.004), M_METAL));
  vec3 rq = vec3(abs(p.x), p.y, abs(p.z));
  res = opU(res, vec2(sdBox(rq - vec3(0.95,-0.56,0.6), vec3(0.045), 0.006), M_BLACK));
  res = opU(res, vec2(sdCylX(rq - vec3(1.0,-0.56,0.6), 0.016, 0.03), M_METAL));
  if(p.z > 0.5){
    vec3 g = p - vec3(0.25, 0.1, 0.75);
    res = opU(res, vec2(sdCylZ(g - vec3(0,0,0.07), 0.17, 0.07), M_METAL));
    res = opU(res, vec2(sdCylZ(g - vec3(0,0,0.24), 0.13, 0.11), M_BLACK));
    res = opU(res, vec2(sdCylZ(g - vec3(0,0,0.20), 0.135, 0.016), M_COPPER));
    res = opU(res, vec2(sdCylZ(g - vec3(0,0,0.38), 0.065, 0.04), M_METAL));
    res = opU(res, vec2(sdCylZ(g - vec3(0,0,0.42), 0.042, 0.006), M_GLASS));
    res = opU(res, vec2(sdBox(p - vec3(-0.35,0.32,0.765), vec3(0.18,0.18,0.012), 0.003), M_EMIT));
    res = opU(res, vec2(sdBox(p - vec3(-0.6,0.0,0.84), vec3(0.1,0.08,0.09), 0.01), M_BLACK));
    res = opU(res, vec2(sdCylZ(p - vec3(-0.6,0.0,0.97), 0.05, 0.05), M_METAL));
    vec3 fp = vec3(abs(p.x), abs(p.y), p.z);
    res = opU(res, vec2(sdCap(fp, vec3(0.86,0.66,0.76), vec3(1.18,0.9,1.02), 0.014), M_METAL));
    vec3 pq = fp - vec3(1.22,0.93,1.05);
    pq.xz = rot(0.55 - 0.35*uFin) * pq.xz; pq.yz = rot(0.45 - 0.3*uFin) * pq.yz;
    res = opU(res, vec2(sdBox(pq, vec3(0.31,0.21,0.009), 0.004), M_COPPER));
    res = opU(res, vec2(sdBox(pq - vec3(0,0,-0.016), vec3(0.33,0.23,0.006), 0.003), M_BLACK));
  }
  if(p.y > 0.6){
    vec3 sh = p - vec3(0.55, 0.7, 0.5);
    res = opU(res, vec2(sdBox(sh - vec3(0,0.03,0), vec3(0.17,0.03,0.17), 0.005), M_METAL));
    res = opU(res, vec2(sdCylY(sh - vec3(0,0.12,0), 0.11, 0.06), M_BLACK));
    res = opU(res, vec2(sdCylY(sh - vec3(0,0.15,0), 0.113, 0.026), M_LIDAR));
    res = opU(res, vec2(sdCylY(sh - vec3(0,0.2,0), 0.1, 0.016), M_METAL));
    vec3 hp = p - vec3(-0.35, 0.7, -0.5);
    res = opU(res, vec2(sdCylY(hp - vec3(0,0.35,0), 0.025, 0.35), M_METAL));
    vec3 dp = hp - vec3(0.0, 0.78, 0.0);
    dp.yz = rot(-0.7) * dp.yz; dp.xy = rot(0.35) * dp.xy;
    float dish = max(abs(length(dp - vec3(0,0.55,0)) - 0.55) - 0.008, length(dp.xz) - 0.32);
    dish = max(dish, dp.y - 0.12);
    res = opU(res, vec2(dish, M_WHITE));
    res = opU(res, vec2(sdCap(dp, vec3(0,0.01,0), vec3(0,0.3,0), 0.012), M_METAL));
    res = opU(res, vec2(sdCylY(p - vec3(0.45,0.81,-0.45), 0.12, 0.11), M_SILVER));
    res = opU(res, vec2(sdBox(p - vec3(-0.72,0.76,-0.2), vec3(0.06,0.05,0.06), 0.005), M_BLACK));
    res = opU(res, vec2(sdCylY(p - vec3(-0.72,0.86,-0.2), 0.045, 0.05), M_BLACK));
    res = opU(res, vec2(sdCylY(p - vec3(-0.45,0.76,0.2), 0.1, 0.05), M_METAL));
    // SPINDAR: octahedral NV-diamond housing beside the LIDAR ring
    vec3 sp = p - vec3(0.8, 0.86, 0.56); float oct = (abs(sp.x)+abs(sp.y)+abs(sp.z) - 0.075)*0.577;
    res = opU(res, vec2(oct, M_METAL));
    res = opU(res, vec2(sdCylZ(sp - vec3(0.0,0.0,0.07), 0.018, 0.02), M_GLASS));
    // NEUROTRIAGE: shielded chip module with heat-spreader fins
    vec3 np = p - vec3(-0.05, 0.74, -0.55);
    res = opU(res, vec2(sdBox(np, vec3(0.12,0.03,0.09), 0.004), M_METAL));
    vec3 fq = np - vec3(0.0,0.06,0.0); fq.x = mod(fq.x + 0.015, 0.03) - 0.015;
    res = opU(res, vec2(max(sdBox(fq, vec3(0.004,0.03,0.085), 0.001), abs(np.x)-0.11), M_METAL));
  }
  if(p.z < -0.5){
    vec3 tp = p - vec3(0.0,-0.1,-0.75);
    res = opU(res, vec2(sdCylZ(tp - vec3(0,0,-0.03), 0.22, 0.03), M_METAL));
    res = opU(res, vec2(sdCylZ(tp - vec3(0,0,-0.12), 0.17, 0.06), M_BLACK));
    res = opU(res, vec2(sdTorusZ(tp - vec3(0,0,-0.18), 0.12, 0.024), M_CERAMIC));
    // STIGMA aft beacon dome
    vec3 bp = p - vec3(0.6, 0.4, -0.76);
    res = opU(res, vec2(sdCylZ(bp, 0.075, 0.012), M_METAL));
    res = opU(res, vec2(max(length(bp) - 0.065, bp.z), M_BEACON));
  }
  // net arm
  res = opU(res, vec2(sdCap(p, uArmS, uArmE, 0.035), M_WHITE));
  res = opU(res, vec2(sdCap(p, uArmE, uArmW, 0.03), M_WHITE));
  res = opU(res, vec2(length(p-uArmS)-0.06, M_BLACK));
  res = opU(res, vec2(length(p-uArmE)-0.05, M_BLACK));
  res = opU(res, vec2(length(p-uArmW)-0.1, M_SILVER));
  if(abs(p.x) > 0.8){ res = opU(res, wing(p, sign(p.x))); }
  return res;
}

vec2 debris(vec3 p){
  vec3 q = transpose(uDebRot) * (p - uDebPos);
  float bs = length(q) - 1.6;
  if(bs > 0.4) return vec2(bs, 0.0);
  vec2 res = vec2(sdBox(q, vec3(0.32,0.26,0.42), 0.02), M_DEBFOIL);
  vec3 bq = q - vec3(0.8, 0.05, 0.05); bq.xy = rot(0.35) * bq.xy; bq.xz = rot(0.2)*bq.xz;
  res = opU(res, vec2(sdBox(bq, vec3(0.45,0.008,0.24), 0.002), M_DEBCELL));
  res = opU(res, vec2(sdBox(q - vec3(-0.42,0.0,0.0), vec3(0.1,0.008,0.24), 0.002), M_DEBCELL));
  res = opU(res, vec2(sdCap(q, vec3(0.1,0.26,0.2), vec3(0.15,0.7,0.35), 0.008), M_METAL));
  res = opU(res, vec2(sdCylZ(q - vec3(0.0,-0.05,0.47), 0.09, 0.05), M_BLACK));
  return res;
}

vec2 rocket(vec3 p){
  vec3 q = transpose(uRbRot) * (p - uRbPos);
  float bs = length(q) - 2.6;
  if(bs > 0.5) return vec2(bs, 0.0);
  vec2 res = vec2(sdCylZ(q, 0.62, 1.55), M_ROCKET);
  res = opU(res, vec2(sdCylZ(q - vec3(0,0,1.6), 0.64, 0.05), M_METAL));
  res = opU(res, vec2(max(length(q - vec3(0,0,1.5)) - 0.62, -(q.z-1.5)), M_ROCKET));
  vec3 nz = q - vec3(0,0,-1.95); float cone = max(length(nz.xy) - (0.18 + 0.28*clamp(-nz.z/0.42+0.5,0.0,1.0)), abs(nz.z)-0.22);
  res = opU(res, vec2(max(cone, -(length(nz.xy) - (0.15 + 0.27*clamp(-nz.z/0.42+0.5,0.0,1.0)))), M_BLACK));
  res = opU(res, vec2(sdCylZ(q - vec3(0,0,-1.62), 0.3, 0.08), M_METAL));
  return res;
}

float shard(vec3 p, int i){
  vec3 q = transpose(uFragRot[i]) * (p - uFragPos[i]);
  float d = sdBox(q, vec3(0.055,0.006,0.04), 0.002);
  d = max(d, dot(q, normalize(vec3(0.7,0.15,0.6))) - 0.03);
  d = max(d, dot(q, normalize(vec3(-0.6,0.1,0.75))) - 0.022);
  return d;
}

// net: spherical shell around uNetC covering directions within uNetAng of -uNetA
float netD(vec3 p){
  vec3 d = p - uNetC; float l = length(d);
  vec3 dn = d/max(l,1e-4);
  float rr = uNetR * (1.0 + 0.07*(vnoise(dn*3.0 + vec3(uTime*0.6)) - 0.5));
  float shell = abs(l - rr) - 0.003;
  float c = dot(d/max(l,1e-4), -uNetA);
  float cut = (cos(uNetAng) - c) * l;          // >0 outside the covered cap
  return max(shell, cut);
}
bool netHole(vec3 p){
  vec3 q = (p - uNetC)*15.0;
  q += 0.18*vec3(vnoise(q*0.4), vnoise(q*0.4+3.0), vnoise(q*0.4+7.0));
  vec3 f = abs(fract(q) - 0.5);
  return max(f.x, max(f.y, f.z)) < 0.455;
}

vec2 scene(vec3 p){
  vec2 res = craft(p);
  if(uDebOn > 0.5) res = opU(res, debris(p));
  for(int i=0;i<4;i++){ if(uFragOn[i] > 0.5) res = opU(res, vec2(shard(p,i), M_FRAG + float(i))); }
  if(uRbOn > 0.5) res = opU(res, rocket(p));
  if(uNetOn > 0.5){
    res = opU(res, vec2(netD(p), M_NET));
    res = opU(res, vec2(sdCap(p, uArmW, uNetC - uNetA*uNetR, 0.006), M_TETHER));
  }
  return res;
}
float sceneShadow(vec3 p){ // net excluded: too fine to cast a solid shadow
  vec2 res = craft(p);
  if(uDebOn > 0.5) res = opU(res, debris(p));
  if(uRbOn > 0.5) res = opU(res, rocket(p));
  return res.x;
}

vec3 calcNormal(vec3 p){
  const vec2 e = vec2(1.0,-1.0)*0.0012;
  return normalize(e.xyy*scene(p+e.xyy).x + e.yyx*scene(p+e.yyx).x + e.yxy*scene(p+e.yxy).x + e.xxx*scene(p+e.xxx).x);
}
float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.02;
  for(int i=0;i<36;i++){
    float h = sceneShadow(ro + rd*t);
    res = min(res, 16.0*h/t);
    t += clamp(h, 0.012, 0.45);
    if(res < 0.002 || t > 12.0) break;
  }
  return clamp(res, 0.0, 1.0);
}
float ambientOcc(vec3 p, vec3 n){
  float o = 0.0, s = 1.0;
  for(int i=1;i<=4;i++){ float h = 0.03 + 0.07*float(i); o += (h - scene(p+n*h).x)*s; s *= 0.7; }
  return clamp(1.0 - 2.0*o, 0.0, 1.0);
}

// ───── atmosphere ─────
vec3 lutT(vec3 p, vec3 l){
  float r = length(p); float mu = dot(p/r, l); float h = clamp(r - R_E, 0.0, 100.0);
  return texture(uLut, vec2((mu+0.6)/1.6, h/100.0)).rgb;
}
vec3 earthM(vec3 n){ n.xz = rot(uEarthSpin) * n.xz; return n; }

vec3 aurora(vec3 ro, vec3 rd, float tMax){
  if(uAurora <= 0.0) return vec3(0.0);
  vec2 s1 = raySphere(ro, rd, R_E + 260.0);
  if(s1.y < 0.0 || s1.x > 1e8) return vec3(0.0);
  float t0 = max(s1.x, 0.0), t1 = min(s1.y, tMax);
  vec2 s0 = raySphere(ro, rd, R_E + 95.0);
  if(s0.x > 0.0 && s0.x < 1e8) t1 = min(t1, s0.x);
  if(t1 <= t0) return vec3(0.0);
  vec3 pole = normalize(vec3(-0.446, 0.719, -0.532));
  vec3 acc = vec3(0.0); float dt = (t1-t0)/20.0;
  for(int i=0;i<20;i++){
    vec3 p = ro + rd*(t0 + dt*(float(i)+0.5));
    float r = length(p); float h = r - R_E; vec3 n = p/r;
    float gl = dot(n, pole);
    vec3 ref = normalize(cross(pole, vec3(0.0,0.0,1.0)));
    float along = atan(dot(n, cross(pole, ref)), dot(n, ref));
    float wav = 0.012*(vnoise(vec3(along*7.0, 0.0, uTime*0.08)) - 0.5) + 0.006*(vnoise(vec3(along*23.0, 1.0, uTime*0.15)) - 0.5);
    float sheet = exp(-pow((gl - 0.93 - wav)/0.0035, 2.0)) + 0.5*exp(-pow((gl - 0.922 - wav*1.3)/0.003, 2.0));
    float rays = 0.35 + 0.65*pow(vnoise(vec3(along*260.0, 0.0, uTime*0.4)), 2.0);
    float patchA = smoothstep(0.3, 0.7, vnoise(vec3(along*3.0, 5.0, 0.0)));
    float vert = exp(-max(h-108.0,0.0)/38.0) * smoothstep(96.0, 108.0, h);
    vec3 c = mix(vec3(0.25,1.0,0.5), vec3(0.75,0.22,0.4), smoothstep(160.0, 250.0, h)*0.6);
    acc += c * sheet * rays * patchA * vert * dt;
  }
  return acc * 0.05 * uAurora;
}

vec3 starfield(vec3 rd){
  vec3 col = vec3(0.0);
  for(int l=0;l<2;l++){
    float sc = l==0 ? 300.0 : 700.0;
    vec3 sp = rd*sc; vec3 cell = floor(sp); float h = hash13(cell + float(l)*17.0);
    float th = l==0 ? 0.994 : 0.985;
    if(h > th){
      vec3 jit = vec3(hash13(cell+1.3), hash13(cell+2.7), hash13(cell+4.1)) - 0.5;
      vec3 f = fract(sp) - 0.5 - jit*0.6;
      float b = pow((h-th)/(1.0-th), 3.0);
      vec3 tint = mix(vec3(0.75,0.85,1.0), vec3(1.0,0.85,0.7), hash13(cell+9.0));
      col += tint * smoothstep(0.06, 0.0, length(f)) * b * (l==0 ? 1.4 : 0.6);
    }
  }
  vec3 mwN = normalize(vec3(0.3, 0.55, -0.78));
  float band = exp(-pow(dot(rd, mwN)/0.2, 2.0));
  float dust = smoothstep(0.42, 0.62, fbm(rd*7.0 + 3.0, 5));
  float glow = band * (0.35 + 0.65*fbm(rd*4.0, 5)) * (1.0 - 0.7*dust*exp(-pow(dot(rd, mwN)/0.07,2.0)));
  col += vec3(0.75,0.78,0.95) * glow * 0.012;
  return col;
}

vec3 sky(vec3 roKm, vec3 rd, vec3 sunL){
  vec2 ta = raySphere(roKm, rd, R_A);
  vec2 te = raySphere(roKm, rd, R_E);
  bool earth = te.x > 0.0 && te.x < 1e8;
  float tEnd = earth ? te.x : ta.y;
  vec3 col = vec3(0.0), transm = vec3(1.0);
  if(ta.y > 0.0 && ta.x < 1e8){
    float tStart = max(ta.x, 0.0);
    float mu = dot(rd, sunL);
    float phR = 3.0/(16.0*PI)*(1.0+mu*mu);
    float g = 0.76; float phM = 3.0/(8.0*PI)*((1.0-g*g)*(1.0+mu*mu))/((2.0+g*g)*pow(1.0+g*g-2.0*g*mu,1.5));
    float dt = (tEnd - tStart)/20.0;
    vec2 od = vec2(0.0); vec3 sR = vec3(0.0), sM = vec3(0.0);
    for(int i=0;i<20;i++){
      vec3 p = roKm + rd*(tStart + dt*(float(i)+0.5));
      vec2 d = densities(p)*dt;
      vec3 Tv = exp(-(BR*(od.x+d.x*0.5) + BM*1.1*(od.y+d.y*0.5)));
      vec3 Tl = lutT(p, sunL);
      sR += d.x*Tv*Tl; sM += d.y*Tv*Tl; od += d;
    }
    col = 13.0*(sR*BR*phR + sM*BM*phM);
    transm = exp(-(BR*od.x + BM*1.1*od.y));
  }
  col += aurora(roKm, rd, earth ? te.x : 1e9);
  if(earth){
    vec3 p = roKm + rd*te.x; vec3 n = normalize(p);
    vec3 m = earthM(n); vec3 sm = earthM(sunL);
    vec4 A = texture(uEarthA, m);
    vec4 B = texture(uEarthB, m);
    float cloud = B.r, land = B.g, ice = B.b;
    // fine detail beyond the baked resolution
    float det = fbm(m*2600.0, 3);
    vec3 alb = A.rgb * (0.82 + 0.36*det*(land*0.8+0.2));
    float cshadow = texture(uEarthB, normalize(m + sm*0.0035)).r;
    vec3 Ts = lutT(p + n*0.2, sunL);
    float ndl = max(dot(n, sunL), 0.0);
    vec3 ground = alb * ndl * Ts * (1.0 - 0.7*cshadow) * 2.6;
    // ocean glint
    float wet = (1.0-land)*(1.0-ice);
    float gl = pow(max(dot(reflect(-sunL, n), -rd), 0.0), 700.0) * wet * 1.2;
    ground += Ts * gl * smoothstep(-0.05, 0.1, dot(n, sunL));
    // clouds: bright tops, soft terminator, slight thickness shading
    float cth = smoothstep(0.0, 1.0, cloud);
    vec3 cloudCol = vec3(0.9,0.91,0.93) * (0.12 + 0.88*smoothstep(-0.08, 0.35, dot(n,sunL))) * Ts * 2.4 * (0.8 + 0.2*det);
    vec3 surf = mix(ground, cloudCol, cth*0.95);
    // night: city lights under thin cloud
    float night = smoothstep(0.03, -0.12, dot(n, sunL));
    surf += vec3(1.0,0.6,0.26) * A.a * night * (1.0 - cth*0.85) * 0.09;
    surf += alb * 0.004;
    col += surf * transm;
  } else {
    float sd = dot(rd, sunL);
    col += vec3(1.0,0.96,0.9) * smoothstep(0.999955, 0.99999, sd) * 4000.0 * transm;
    col += vec3(1.0,0.86,0.68) * pow(max(sd,0.0), 4000.0) * 30.0 * transm;
    col += starfield(rd) * transm * smoothstep(0.2, 1.0, transm.b);
  }
  return col;
}

vec3 envLook(vec3 rd, vec3 roKm, vec3 sunL){
  vec2 te = raySphere(roKm, rd, R_E);
  if(te.x > 0.0 && te.x < 1e8){
    vec3 n = normalize(roKm + rd*te.x);
    vec4 A = textureLod(uEarthA, earthM(n), 5.0); vec4 B = textureLod(uEarthB, earthM(n), 5.0);
    float ndl = dot(n, sunL);
    vec3 alb = mix(A.rgb, vec3(0.9), B.r);
    vec3 lit = alb * max(ndl,0.0) * 2.4 + vec3(0.03,0.07,0.16)*smoothstep(-0.2,0.4,ndl);
    return lit;
  }
  return vec3(1.0,0.92,0.8)*pow(max(dot(rd,sunL),0.0),300.0)*30.0;
}

float ggx(float NdH, float a){ float a2 = a*a; float d = NdH*NdH*(a2-1.0)+1.0; return a2/(PI*d*d); }

vec3 shade(vec3 p, vec3 rd, float mat, vec3 roKm, vec3 sunL){
  vec3 n = calcNormal(p);
  vec3 alb; float metal = 0.0, rough = 0.5; vec3 emis = vec3(0.0);
  if(mat == M_GOLD || mat == M_SILVER){
    float e0 = 0.01;
    float r0 = 1.0 - abs(2.0*fbm(p*6.0, 4) - 1.0);
    vec3 gr = vec3(1.0 - abs(2.0*fbm((p+vec3(e0,0,0))*6.0, 4) - 1.0) - r0,
                   1.0 - abs(2.0*fbm((p+vec3(0,e0,0))*6.0, 4) - 1.0) - r0,
                   1.0 - abs(2.0*fbm((p+vec3(0,0,e0))*6.0, 4) - 1.0) - r0) / e0;
    vec3 fine = vec3(fbm(p*45.0,2), fbm(p*45.0+3.0,2), fbm(p*45.0+9.0,2)) - 0.5;
    gr -= n*dot(gr,n);
    n = normalize(n - gr*0.034 + fine*0.08);
    alb = (mat == M_GOLD) ? vec3(1.0,0.76,0.36) : vec3(0.9,0.91,0.93);
    alb *= 0.9 + 0.15*r0; metal = 1.0; rough = 0.26 + 0.16*r0;
    // kapton tape seams
    float seam = smoothstep(0.008, 0.0, abs(fract(p.z*1.333+0.5)-0.5)/1.333 - 0.01) + smoothstep(0.008, 0.0, abs(fract(p.y*1.6+0.2)-0.5)/1.6 - 0.008);
    alb = mix(alb, alb*vec3(0.85,0.65,0.4), clamp(seam,0.0,1.0)*0.6);
  } else if(mat == M_WHITE){ alb = vec3(0.80,0.80,0.78); rough = 0.6; }
  else if(mat == M_BLACK){ alb = vec3(0.025); rough = 0.4; metal = 0.3; }
  else if(mat == M_INTERIOR){ alb = vec3(0.015); rough = 0.7; }
  else if(mat == M_METAL){ alb = vec3(0.64,0.65,0.68); rough = 0.3 + 0.1*fbm(p*25.0,2); metal = 1.0; }
  else if(mat == M_COPPER){ vec3 lp = p*vec3(9.0,9.0,9.0); float brush = vnoise(vec3(lp.x*40.0, lp.y*0.8, lp.z*0.8)); alb = vec3(0.86,0.45,0.25)*(0.82+0.25*brush); rough = 0.16 + 0.12*brush; metal = 1.0; }
  else if(mat == M_CERAMIC){ alb = vec3(0.78,0.76,0.72); rough = 0.55; }
  else if(mat == M_GLASS){ alb = vec3(0.01,0.012,0.02); rough = 0.04; }
  else if(mat == M_CELL){
    vec3 lp = vec3(abs(p.x), p.y, p.z);
    vec2 uv = vec2(lp.x*7.0, lp.z*7.5);
    vec2 f = abs(fract(uv)-0.5);
    float gap = smoothstep(0.455,0.475,max(f.x,f.y));
    float finger = smoothstep(0.03,0.0, abs(fract(uv.x*5.0)-0.5)-0.47);
    float busbar = smoothstep(0.02,0.0, abs(f.y-0.38));
    bool front = n.y > 0.0;
    vec3 cellc = vec3(0.012,0.017,0.05) + vec3(0.0,0.004,0.012)*hash12(floor(uv));
    alb = front ? mix(cellc, vec3(0.42,0.44,0.48), max(gap, max(finger*0.22, busbar*0.5))) : vec3(0.70,0.70,0.66);
    rough = front ? 0.1 + gap*0.4 : 0.7;
  } else if(mat == M_DEBFOIL){
    vec3 q = transpose(uDebRot)*(p-uDebPos);
    float scorch = smoothstep(0.5, 0.8, fbm(q*5.0, 5));
    vec3 wn = vec3(fbm(q*7.0,3), fbm(q*7.0+4.0,3), fbm(q*7.0+9.0,3)) - 0.5;
    n = normalize(n + wn*0.35);
    alb = mix(vec3(0.62,0.6,0.58), vec3(0.05,0.045,0.04), scorch); rough = 0.45; metal = 0.8;
  } else if(mat == M_DEBCELL){
    vec3 q = transpose(uDebRot)*(p-uDebPos);
    float crack = smoothstep(0.02,0.0, abs(fbm(q*9.0,4)-0.5));
    alb = mix(vec3(0.02,0.025,0.05), vec3(0.4), crack*0.6); rough = 0.25;
  } else if(mat == M_NET || mat == M_TETHER){
    alb = vec3(0.82,0.78,0.68); rough = 0.8;
    if(mat == M_NET && uSkin > 0.0){
      // ELECTROSKIN grip map: 3x3 tiles facing the object; amber = grip, blue = edge push
      vec3 dl = normalize(p - uNetC);
      vec3 tq = (p - uNetC) * 3.2;
      vec2 cellv = floor(vec2(atan(dl.x, dl.z)*1.4, dl.y*2.6));
      float hsh = hash12(cellv + floor(uTime*3.0)*0.0);
      float press = 0.5 + 0.5*sin(dot(dl, vec3(1.3,0.7,-0.9))*5.0 - uTime*3.0);
      vec3 tile = mix(vec3(0.25,0.55,1.0), vec3(1.0,0.6,0.15), step(0.45, press*0.7 + hsh*0.4));
      emis += tile * uSkin * (0.9 + 0.6*hsh) * 0.9;
    }
  } else if(mat == M_EMIT){
    // V2 phased micro-emitter array: 4x4 emitters on a black plate
    vec2 g = (p.xy - vec2(-0.35,0.32)) / 0.36 * 4.0 + 2.0;
    vec2 cf = fract(g) - 0.5; vec2 ci = floor(g);
    float dot0 = smoothstep(0.32, 0.22, length(cf));
    alb = mix(vec3(0.02), vec3(0.45,0.46,0.5), dot0); metal = dot0; rough = 0.25;
    float ph = hash12(ci) * 6.28;
    emis += vec3(0.4,0.65,1.0) * dot0 * uEmit * (2.5 + 1.5*sin(uTime*40.0 + ph));
  } else if(mat == M_LIDAR){
    alb = vec3(0.01,0.012,0.02); rough = 0.05;
    float ang = atan(p.z - 0.5, p.x - 0.55);
    float sweep = pow(0.5 + 0.5*cos(ang - uTime*9.0), 24.0);
    emis += vec3(1.0,0.25,0.15) * sweep * uLidar * 3.0 + vec3(0.6,0.1,0.05)*uLidar*0.15;
  } else if(mat == M_BEACON){
    alb = vec3(0.85,0.86,0.88); rough = 0.3;
    float pulse = pow(fract(uTime*0.9), 6.0) * 0.0 + exp(-fract(uTime*0.9)*6.0);
    emis += vec3(0.95,0.35,1.0) * uBeacon * pulse * 4.0;
  } else if(mat == M_ROCKET){
    vec3 q = transpose(uRbRot)*(p-uRbPos);
    float band = step(0.9, q.z) * step(q.z, 1.2) + step(-1.2, q.z)*step(q.z, -1.0);
    float grime = fbm(q*3.0, 4);
    alb = mix(vec3(0.75,0.74,0.7), vec3(0.08), band) * (0.75 + 0.3*grime);
    alb = mix(alb, vec3(0.2,0.17,0.14), smoothstep(-1.0,-1.6,q.z)*0.8);
    rough = 0.6;
    // STIGMA tag: coded charge signature, read later by another probe's SPINDAR
    if(uTag > 0.0){
      float th = atan(q.y, q.x);
      vec2 tg = vec2((th - 0.0)*3.2, q.z*3.2);
      vec2 tc = floor(tg); vec2 tf = fract(tg) - 0.5;
      float inside = step(-2.0, tc.y) * step(tc.y, 1.0);
      float bit = step(0.4, hash12(tc + 3.0));
      float d0 = smoothstep(0.3, 0.18, length(tf));
      emis += vec3(0.85,0.4,1.0) * inside * bit * d0 * uTag * (2.0 + 0.6*sin(uTime*6.0 + tc.y));
    }

    int i = int(mat - M_FRAG + 0.5);
    float fm = uFragMat[i];
    if(fm < 0.5){ alb = vec3(0.75,0.76,0.78); metal = 0.9; rough = 0.3; }
    else if(fm < 1.5){ alb = vec3(0.95,0.55,0.12); metal = 0.55; rough = 0.25; }
    else { vec3 q = transpose(uFragRot[i])*(p-uFragPos[i]); float weave = step(0.5, fract(q.x*90.0 + step(0.5,fract(q.z*90.0))*0.5)); alb = vec3(0.03)+vec3(0.05)*weave; metal = 0.2; rough = 0.35; }
    float gw = uFragGlow[i];
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 2.0);
    emis = vec3(0.35,0.6,1.0) * gw * (0.8 + 3.0*rim) * 2.2;
  }
  vec3 v = -rd;
  vec3 h = normalize(sunL + v);
  float ndl = max(dot(n, sunL), 0.0), ndv = max(dot(n, v), 1e-3), ndh = max(dot(n, h), 0.0), vdh = max(dot(v,h),0.0);
  float sh = (ndl > 0.0 && mat != M_NET) ? softShadow(p + n*0.004, sunL) : (mat == M_NET ? 0.85 : 0.0);
  vec3 F0 = mix(vec3(0.04), alb, metal);

  vec3 sunCol = vec3(1.0,0.96,0.9) * 4.2 * uSunT;
  float floorK = (mat == M_GOLD || mat == M_SILVER) ? 0.16 : 0.04;
  vec3 col = (kd*alb/PI + spec + metal*alb*floorK) * sunCol * ndl * sh;
  float eLit = smoothstep(-0.45, 0.6, sunL.y);
  vec3 earthCol = vec3(0.11,0.135,0.18)*eLit + vec3(0.004,0.005,0.008);
  float ndE = max(dot(n, vec3(0,-1,0))*0.5+0.5, 0.0);
  float ao = ambientOcc(p, n);
  col += (kd + metal*0.45)*alb*earthCol*ndE*ao*1.4;
  vec3 r = reflect(rd, n);
  col += envLook(r, roKm, sunL) * F * (1.0 - rough*0.85) * ao * (metal*0.9 + 0.35) * 0.6;

}

float segDist(vec3 ro, vec3 rd, vec3 a, vec3 b, out float tRay){
  vec3 v = b - a, w0 = ro - a;
  float bb = dot(rd, v), c = dot(v, v), d = dot(rd, w0), e = dot(v, w0);
  float den = max(c - bb*bb, 1e-6);
  float tc = clamp((e - bb*d) / den, 0.0, 1.0);
  vec3 q = a + v*tc;
  tRay = max(dot(q - ro, rd), 0.0);
  return length(ro + rd*tRay - q);
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  float fl = 1.0 / tan(uFov*0.5);
  vec3 rd = normalize(uCamFwd*fl + uCamRight*uv.x*2.0 + uCamUp*uv.y*2.0);
  vec3 ro = uCamPos;
  vec3 roKm = vec3(0.0, R_E + ALT, 0.0) + ro*0.001;
  vec3 sunL = normalize(uSun);

  float tHit = -1.0, mat = 0.0;
  vec2 bc = raySphere(ro, rd, 6.6);
  bool tryCraft = bc.y > 0.0 && bc.x < 1e8;
  vec2 bd = raySphere(ro - uDebPos, rd, 2.2);
  bool tryDeb = uDebOn > 0.5 && bd.y > 0.0 && bd.x < 1e8;
  bool tryFrag = false; float tf0 = 1e9, tf1 = -1e9;
  for(int i=0;i<4;i++){ if(uFragOn[i] > 0.5){ vec2 bf = raySphere(ro - uFragPos[i], rd, 0.12); if(bf.y > 0.0 && bf.x < 1e8){ tryFrag = true; tf0 = min(tf0, max(bf.x,0.0)); tf1 = max(tf1, bf.y); } } }
  vec2 br = raySphere(ro - uRbPos, rd, 2.6);
  bool tryRb = uRbOn > 0.5 && br.y > 0.0 && br.x < 1e8;
  bool tryNet = false; vec2 bn = vec2(1e9,-1e9);
  if(uNetOn > 0.5){ bn = raySphere(ro - uNetC, rd, uNetR + 0.05); tryNet = bn.y > 0.0 && bn.x < 1e8; }
  if(tryCraft || tryDeb || tryFrag || tryNet || tryRb){
    float tmin = 1e9, tmax = -1e9;
    if(tryCraft){ tmin = min(tmin, max(bc.x,0.0)); tmax = max(tmax, bc.y); }
    if(tryDeb){ tmin = min(tmin, max(bd.x,0.0)); tmax = max(tmax, bd.y); }
    if(tryFrag){ tmin = min(tmin, tf0); tmax = max(tmax, tf1); }
    if(tryNet){ tmin = min(tmin, max(bn.x,0.0)); tmax = max(tmax, bn.y); }
    if(tryRb){ tmin = min(tmin, max(br.x,0.0)); tmax = max(tmax, br.y); }
    float t = tmin;
    for(int i=0;i<220;i++){
      vec3 pp = ro + rd*t;
      vec2 h = scene(pp);
      if(h.x < 0.0005*t + 0.0003){
        if(h.y == M_NET && netHole(pp)){ t += 0.012; continue; }
        tHit = t; mat = h.y; break;
      }
      t += h.x*0.9;
      if(t > tmax) break;
    }
  }

  float tScene = tHit > 0.0 ? tHit : 1e9;

  if(uBeam > 0.0){
    float tb; float d = segDist(ro, rd, uBeamA, uBeamB, tb);
    if(tb < tScene){

      col += vec3(0.42,0.62,1.0) * (exp(-d*d/0.0004)*2.6 + exp(-d*d/0.008)*0.35 + exp(-d*d/0.06)*0.06) * uBeam * fl2;
    }

    float ts; float ds = segDist(ro, rd, uBeamB, uBeamB + vec3(1e-4), ts);
    col += vec3(0.55,0.75,1.0) * (exp(-ds*ds/0.0006)*14.0 + exp(-ds*ds/0.01)*1.2) * uBeam * (0.8 + 0.4*hash12(vec2(uTime*60.0, 1.0)));

  if(uUv > 0.0){
    float tu; float d = segDist(ro, rd, vec3(-0.6,0.0,1.03), uUvB, tu);
    if(tu < tScene) col += vec3(0.55,0.25,1.0) * (exp(-d*d/0.0003)*2.0 + exp(-d*d/0.01)*0.25) * uUv;
  }
  // SPINDAR 532 nm pulses
  if(uGrn > 0.0){
    float tg; float d = segDist(ro, rd, vec3(0.8,0.86,0.64), uGrnB, tg);
    float pulse = step(0.5, fract(uTime*7.0));
    if(tg < tScene) col += vec3(0.2,1.0,0.3) * (exp(-d*d/0.00012)*2.5 + exp(-d*d/0.004)*0.15) * uGrn * (0.35 + 0.65*pulse);
  }
  // MYCENET filaments: 9 carbon-nanotube strands, with charge pulses travelling outward
  if(uFil > 0.0){
    vec3 base = vec3(0.45,0.95,-0.45);
    for(int k=0;k<9;k++){
      vec3 e = base + uFilDir[k] * (0.3 + 199.7*uFil);
      float tf; float d = segDist(ro, rd, base, e, tf);
      if(tf < tScene){
        float w = 0.00045*tf + 0.0004;
        vec3 cp = ro + rd*tf; float along = length(cp - base);
        float pul = 0.55 + 0.45*sin(along*0.8 - uTime*5.0 + float(k));
        col += vec3(0.65,0.75,1.0) * exp(-d*d/(w*w)) * (0.42*pul) * exp(-along/90.0) * uFil;
      }
    }
  }
  // spark where a fragment touches a filament
  if(uFilSpark > 0.0){
    float ts; float d = segDist(ro, rd, uFilHit, uFilHit + vec3(1e-4), ts);
    float w = 0.004*ts + 0.01;
    col += vec3(0.6,0.8,1.0) * (exp(-d*d/(w*w*0.2))*20.0 + exp(-d*d/(w*w*6.0))*1.5) * uFilSpark;
  }
  if(uThrust > 0.0){
    vec3 a = vec3(0.0,-0.1,-0.95), b = vec3(0.0,-0.1,-3.6);
    float tp; float d = segDist(ro, rd, a, b, tp);
    vec3 cp = ro + rd*tp; float along = clamp(-(cp.z + 0.95)/2.65, 0.0, 1.0);
    float w = 0.05 + along*0.35;
    if(tp < tScene) col += vec3(0.35,0.45,1.0) * exp(-d*d/(w*w)) * (1.0-along) * uThrust * 1.6;
  }
  if(uRcs > 0.0){
    float tp; float d = segDist(ro, rd, vec3(0.99,-0.56,0.64), vec3(1.4,-0.56,0.9), tp);
    if(tp < tScene) col += vec3(0.9) * exp(-d*d/0.004) * uRcs * 0.8;

    col = pow(aces(col*uExposure), vec3(1.0/2.2));
  }
  fragColor = vec4(col, 1.0);
}

<script id="fs_down" type="x-shader">
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThresh;
void main(){
  vec3 c = texture(uTex, vUv + uTexel*vec2(-1,-1)).rgb + texture(uTex, vUv + uTexel*vec2(1,-1)).rgb
         + texture(uTex, vUv + uTexel*vec2(-1, 1)).rgb + texture(uTex, vUv + uTexel*vec2(1, 1)).rgb;
  c *= 0.25;
  if(uThresh > 0.0){ float l = max(c.r,max(c.g,c.b)); c *= max(l - uThresh, 0.0) / max(l, 1e-4); c = min(c, vec3(400.0)); }
  o = vec4(c, 1.0);
}
</script>
<script id="fs_up" type="x-shader">
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec3 c = texture(uTex, vUv).rgb*4.0;
  c += (texture(uTex, vUv+uTexel*vec2(-1,0)).rgb + texture(uTex, vUv+uTexel*vec2(1,0)).rgb + texture(uTex, vUv+uTexel*vec2(0,-1)).rgb + texture(uTex, vUv+uTexel*vec2(0,1)).rgb)*2.0;
  c += texture(uTex, vUv+uTexel*vec2(-1,-1)).rgb + texture(uTex, vUv+uTexel*vec2(1,-1)).rgb + texture(uTex, vUv+uTexel*vec2(-1,1)).rgb + texture(uTex, vUv+uTexel*vec2(1,1)).rgb;
  o = vec4(c/16.0, 1.0);

<!-- ═════════════ composite: AA, bloom, lens, grade ═════════════ -->
<script id="fs_comp" type="x-shader">
in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uBloom, uBloomWide; uniform vec2 uTexel; uniform float uExposure, uTime, uBloomK; uniform vec2 uRes;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }

  vec3 cSW = tm(texture(uScene, vUv + uTexel*vec2(-1,-1)).rgb), cSE = tm(texture(uScene, vUv + uTexel*vec2(1,-1)).rgb);

  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));

  col += (hash12(vUv*uRes + fract(uTime*7.13)*517.0) - 0.5) * 0.018;
  o = vec4(col, 1.0);
}

<script>

const qs = new URLSearchParams(location.search);

    S.deb = { pos:big.L, R:big.R };
    S.net = { on:big.netOn, C:big.C, A:big.A, r:big.r, ang:big.ang };
  }
  S.cam = cam; S.beamA = EMIT;
  S.sunT = sunTransmittance(V.norm(S.sun));
  return S;
}

// ═════════════════════════ mission overlay ═════════════════════════
const hud = document.getElementById('hud'), hx = hud.getContext('2d');
function project(S, P){
  const d = V.sub(P, S.cam.pos); const z = V.dot(d, S.cam.f); if (z <= 0.05) return null;
  const fl = 1/Math.tan(S.fov/2); const H = innerHeight, W = innerWidth;
  const ux = V.dot(d, S.cam.r)/z*fl/2, uy = V.dot(d, S.cam.u)/z*fl/2;
  return { x: W/2 + ux*H, y: H/2 - uy*H, z, s: fl/2*H/z };
}
function drawHUD(S, t){
  const dpr = Math.min(devicePixelRatio||1, 2);
  if (hud.width !== Math.round(innerWidth*dpr) || hud.height !== Math.round(innerHeight*dpr)){ hud.width = Math.round(innerWidth*dpr); hud.height = Math.round(innerHeight*dpr); }
  hx.setTransform(dpr,0,0,dpr,0,0); hx.clearRect(0,0,innerWidth,innerHeight);
  if (EMBED || qs.has('nohud')) return;
  const mono = (sz, w=400) => `${w} ${sz}px "JetBrains Mono", ui-monospace, monospace`;
  // field lines from the four panel fins to each attracted fragment
  const fins = [[1.22,0.93,1.05],[-1.22,0.93,1.05],[1.22,-0.93,1.05],[-1.22,-0.93,1.05]];
  hx.lineWidth = 1; hx.setLineDash([3,5]); hx.lineDashOffset = -t*30;
  for (const fp of S.hud.field){
    for (const f of fins){
      hx.strokeStyle = 'rgba(140,200,255,0.28)'; hx.beginPath();
      for (let i=0;i<=24;i++){ const s=i/24; const mid = V.add(V.lerp(f, fp, 0.5), [0, 0.35*Math.sign(f[1]), 0]);
        const p = V.add(V.add(V.mul(f,(1-s)*(1-s)), V.mul(mid, 2*s*(1-s))), V.mul(fp, s*s)); const q = project(S, p); if (!q) continue; i ? hx.lineTo(q.x,q.y) : hx.moveTo(q.x,q.y); }
      hx.stroke();
    }
  }
  hx.setLineDash([]);
  // targets (labels avoid each other and the decision panel)
  const placed = []; if (S.hud.neuro > 0) placed.push([innerWidth-330, 70, innerWidth, 232]);
  for (const g of S.hud.targets){
    const q = project(S, g.pos); if (!q) continue;
    const rr = Math.max(14, Math.min(140, g.r*q.s)) * (1 + 1.5*(1-g.lock));
    const c = g.color; hx.strokeStyle = c; hx.globalAlpha = 0.25 + 0.75*g.lock; hx.lineWidth = 1.3;
    const L = Math.max(5, rr*0.35);
    for (const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ hx.beginPath(); hx.moveTo(q.x+sx*rr, q.y+sy*(rr-L)); hx.lineTo(q.x+sx*rr, q.y+sy*rr); hx.lineTo(q.x+sx*(rr-L), q.y+sy*rr); hx.stroke(); }
    if (g.lock >= 1 && g.lines.length){
      hx.font = mono(g.small ? 10.5 : 11.5, 500);
      const tw = Math.max(...g.lines.map(l => hx.measureText(l).width));
      const right = q.x + rr + 18 + tw < innerWidth - 300*(S.hud.neuro>0?1:0) - 10;
      const lx = right ? q.x + rr + 14 : q.x - rr - 14 - tw; let ly = Math.max(70, q.y - rr);
      const hh = g.lines.length*15 + 4;
      for (let guard=0; guard<12; guard++){ const hit = placed.find(([a,b,c,d]) => lx < c && lx+tw > a && ly-10 < d && ly-10+hh > b); if (!hit) break; ly = hit[3] + 14; }
      placed.push([lx, ly-10, lx+tw, ly-10+hh]);
      hx.beginPath(); hx.moveTo(q.x + (right?rr:-rr), q.y-rr); hx.lineTo(right ? lx-4 : lx+tw+4, ly); hx.stroke();
      hx.fillStyle = c; hx.shadowColor = 'rgba(0,0,0,.9)'; hx.shadowBlur = 6;
      g.lines.forEach((ln, i) => { hx.globalAlpha = i === 0 ? 1 : 0.82; hx.fillText(ln, lx, ly + 4 + i*15); });
      hx.shadowBlur = 0;
    }
    hx.globalAlpha = 1;
  }
  // STIGMA beacon pulses and the second probe
  if (S.hud.beacon > 0){
    const q = project(S, [0.6,0.4,-0.82]);
    if (q){ for (let k=0;k<3;k++){ const ph = (t*0.9 + k/3) % 1; hx.strokeStyle = `rgba(215,155,255,${(1-ph)*0.6*S.hud.beacon})`; hx.lineWidth = 1.5; hx.beginPath(); hx.arc(q.x, q.y, 8 + ph*Math.min(innerWidth,innerHeight)*0.45, 0, Math.PI*2); hx.stroke(); } }
  }
  if (S.hud.peer > 0){
    const q = project(S, PEER);
    if (q && q.x > 0 && q.x < innerWidth && q.y > 0 && q.y < innerHeight){
      hx.globalAlpha = S.hud.peer; hx.strokeStyle = '#d79bff'; hx.fillStyle = '#d79bff'; hx.lineWidth = 1.3;
      hx.beginPath(); hx.moveTo(q.x, q.y-9); hx.lineTo(q.x+9, q.y); hx.lineTo(q.x, q.y+9); hx.lineTo(q.x-9, q.y); hx.closePath(); hx.stroke();
      hx.beginPath(); hx.arc(q.x, q.y, 1.6, 0, 7); hx.fill();
      hx.font = mono(11.5, 500); hx.shadowColor='rgba(0,0,0,.9)'; hx.shadowBlur=6;
      const pw = hx.measureText('beacon received · separation OK (> 500 m)').width; const px = (q.x + 16 + pw < innerWidth - 12) ? q.x + 16 : q.x - 16 - pw;
      hx.fillText('ESPIRA P-02  812 m', px, q.y-2); hx.globalAlpha = S.hud.peer*0.8; hx.fillText('beacon received · separation OK (> 500 m)', px, q.y+13);
      hx.shadowBlur = 0; hx.globalAlpha = 1;
    }
  }
  // NEUROTRIAGE spike panel
  if (S.hud.neuro > 0){
    const W = 300, H = 150, x0 = innerWidth - W - 26, y0 = 76;
    hx.globalAlpha = S.hud.neuro;
    hx.fillStyle = 'rgba(6,10,16,0.62)'; hx.strokeStyle = 'rgba(160,200,255,0.25)'; hx.lineWidth = 1;
    hx.beginPath(); hx.roundRect ? hx.roundRect(x0, y0, W, H, 8) : hx.rect(x0,y0,W,H); hx.fill(); hx.stroke();
    hx.font = mono(10.5, 500); hx.fillStyle = '#e2bd74'; hx.fillText('NEUROTRIAGE · spiking neural network', x0+12, y0+18);
    const rows = 18, cols = 60, gx = x0+12, gy = y0+28, gw = W-24, gh = 56;
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const tt = Math.floor(t*30) - (cols - c);
      const h = Math.sin(r*127.1 + tt*311.7)*43758.5453; const fr = h - Math.floor(h);
      if (fr > 0.93){ hx.fillStyle = r < 4 ? 'rgba(240,164,58,0.95)' : 'rgba(150,200,255,0.8)'; hx.fillRect(gx + c*gw/cols, gy + r*gh/rows, 1.6, gh/rows - 1); }
    }
    hx.font = mono(10.5); hx.fillStyle = 'rgba(220,226,232,0.9)';
    if (S.hud.decisions.length){ S.hud.decisions.forEach(([a,b], i) => { hx.fillStyle = 'rgba(160,170,180,0.9)'; hx.fillText(a, gx, gy + gh + 16 + i*13); hx.fillStyle = '#9fd4ff'; hx.fillText('→ ' + b, gx + 70, gy + gh + 16 + i*13); }); }
    else { hx.fillStyle = 'rgba(160,170,180,0.9)'; hx.fillText('integrating sensor events…  < 80 ms', gx, gy + gh + 16); }
    hx.globalAlpha = 1;
  }
  // telemetry
  if (S.hud.tele.length){
    hx.font = mono(11, 500); hx.shadowColor='rgba(0,0,0,.9)'; hx.shadowBlur=6;
    S.hud.tele.forEach((ln, i) => { hx.fillStyle = i===0 ? '#e2bd74' : 'rgba(220,226,232,0.85)'; hx.fillText(ln, 22, 76 + i*16); });
    hx.shadowBlur = 0;
  }
  // chapter marker
  const ch = [...CHAPTERS].reverse().find(c => t >= c.t);
  if (ch){ hx.font = mono(11, 500); hx.fillStyle = 'rgba(226,189,116,0.9)'; hx.shadowColor='rgba(0,0,0,.8)'; hx.shadowBlur=6; hx.fillText(`${ch.n} / ${ch.name.toUpperCase()}`, 22, 52); hx.shadowBlur=0; }
}

// ── resolution management ──
const DPR = Math.min(devicePixelRatio || 1, 2);
let scale = STILL ? parseFloat(qs.get('scale') || '1') : (DPR > 1.5 ? 0.62 : 0.9);
if (EMBED && !STILL) scale *= 0.85;
function resize(){
  const w = Math.round(innerWidth*DPR), h = Math.round(innerHeight*DPR);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
}

const fadeEl = document.getElementById('fade'), cap = document.getElementById('cap'), capk = document.getElementById('capk'), capt = document.getElementById('capt'), prog = document.getElementById('prog');
let capIdx = -1;

function render(t){
  resize();
  const S = state(t);
  const sw = Math.max(64, Math.round(cv.width*scale)), sh = Math.max(64, Math.round(cv.height*scale));
  const T = targets(sw, sh);
  // ── scene ──
  const Ps = P.scene; gl.useProgram(Ps.p);
  if (HDR) { gl.bindFramebuffer(gl.FRAMEBUFFER, T.scene.fb); gl.viewport(0,0,sw,sh); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,cv.width,cv.height); }
  const rw = HDR ? sw : cv.width, rh = HDR ? sh : cv.height;
  gl.uniform2f(u(Ps,'uRes'), rw, rh); gl.uniform1f(u(Ps,'uTime'), t);
  gl.uniform3fv(u(Ps,'uCamPos'), S.cam.pos); gl.uniform3fv(u(Ps,'uCamFwd'), S.cam.f); gl.uniform3fv(u(Ps,'uCamRight'), S.cam.r); gl.uniform3fv(u(Ps,'uCamUp'), S.cam.u);
  gl.uniform1f(u(Ps,'uFov'), S.fov); gl.uniform3fv(u(Ps,'uSun'), S.sun); gl.uniform3fv(u(Ps,'uSunT'), S.sunT);
  gl.uniform1f(u(Ps,'uExposure'), S.exposure); gl.uniform1i(u(Ps,'uLDR'), HDR ? 0 : 1);
  gl.uniform1f(u(Ps,'uDeploy'), S.deploy); gl.uniform1f(u(Ps,'uWingTilt'), S.tilt); gl.uniform1f(u(Ps,'uBayOpen'), S.bay);
  gl.uniformMatrix3fv(u(Ps,'uDebRot'), false, S.deb.R); gl.uniform3fv(u(Ps,'uDebPos'), S.deb.pos); gl.uniform1f(u(Ps,'uDebOn'), S.debOn);
  gl.uniform3fv(u(Ps,'uArmS'), S.arm.S); gl.uniform3fv(u(Ps,'uArmE'), S.arm.E); gl.uniform3fv(u(Ps,'uArmW'), S.arm.W);
  gl.uniform3fv(u(Ps,'uBeamA'), S.beamA); gl.uniform3fv(u(Ps,'uBeamB'), S.beamB); gl.uniform1f(u(Ps,'uBeam'), S.beam);
  gl.uniform3fv(u(Ps,'uFragPos'), S.frags.flatMap(f=>f.pos)); gl.uniformMatrix3fv(u(Ps,'uFragRot'), false, S.frags.flatMap(f=>f.R));
  gl.uniform1fv(u(Ps,'uFragOn'), S.frags.map(f=>f.on)); gl.uniform1fv(u(Ps,'uFragGlow'), S.frags.map(f=>f.glow)); gl.uniform1fv(u(Ps,'uFragMat'), S.frags.map(f=>f.mat));
  gl.uniform3fv(u(Ps,'uUvB'), S.uvB); gl.uniform1f(u(Ps,'uUv'), S.uv); gl.uniform3fv(u(Ps,'uGrnB'), S.grnB); gl.uniform1f(u(Ps,'uGrn'), S.grn);
  gl.uniform1f(u(Ps,'uEmit'), S.emit); gl.uniform1f(u(Ps,'uFin'), S.fin); gl.uniform1f(u(Ps,'uFil'), S.fil); gl.uniform1f(u(Ps,'uSkin'), S.skin);
  gl.uniform1f(u(Ps,'uBeacon'), S.beacon); gl.uniform1f(u(Ps,'uLidar'), S.lidar); gl.uniform1f(u(Ps,'uDish'), S.dish); gl.uniform1f(u(Ps,'uTag'), S.tag);
  gl.uniform1f(u(Ps,'uFilSpark'), S.filSpark); gl.uniform3fv(u(Ps,'uFilHit'), HIT_P); gl.uniform3fv(u(Ps,'uFilDir'), FIL_DIRS.flat());
  gl.uniform3fv(u(Ps,'uRbPos'), S.rb.pos); gl.uniformMatrix3fv(u(Ps,'uRbRot'), false, S.rb.R); gl.uniform1f(u(Ps,'uRbOn'), S.rbOn);
  gl.uniform3fv(u(Ps,'uNetC'), S.net.C); gl.uniform3fv(u(Ps,'uNetA'), S.net.A); gl.uniform1f(u(Ps,'uNetR'), S.net.r); gl.uniform1f(u(Ps,'uNetAng'), S.net.ang); gl.uniform1f(u(Ps,'uNetOn'), S.net.on);
  gl.uniform1f(u(Ps,'uThrust'), S.thrust); gl.uniform1f(u(Ps,'uRcs'), S.rcs); gl.uniform1f(u(Ps,'uAurora'), S.aurora);
  gl.uniform1f(u(Ps,'uEarthSpin'), t*0.0004 + 0.6);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_CUBE_MAP, earthA); gl.uniform1i(u(Ps,'uEarthA'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_CUBE_MAP, earthB); gl.uniform1i(u(Ps,'uEarthB'), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, lut.t); gl.uniform1i(u(Ps,'uLut'), 2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (HDR){
    // ── bloom: threshold + downsample chain, then tent upsample ──
    const B = T.blooms; gl.useProgram(P.down.p); gl.activeTexture(gl.TEXTURE0); gl.uniform1i(u(P.down,'uTex'), 0);
    let srcT = T.scene;
    for (let i=0;i<B.length;i++){
      gl.bindFramebuffer(gl.FRAMEBUFFER, B[i].fb); gl.viewport(0,0,B[i].w,B[i].h);
      gl.bindTexture(gl.TEXTURE_2D, srcT.t); gl.uniform2f(u(P.down,'uTexel'), 1/srcT.w, 1/srcT.h); gl.uniform1f(u(P.down,'uThresh'), i===0 ? 1.4 : 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3); srcT = B[i];
    }
    gl.useProgram(P.up.p); gl.uniform1i(u(P.up,'uTex'), 0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i=B.length-1;i>1;i--){
      gl.bindFramebuffer(gl.FRAMEBUFFER, B[i-1].fb); gl.viewport(0,0,B[i-1].w,B[i-1].h);
      gl.bindTexture(gl.TEXTURE_2D, B[i].t); gl.uniform2f(u(P.up,'uTexel'), 1/B[i].w, 1/B[i].h); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
    // ── composite to screen ──
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,cv.width,cv.height);
    const Pc = P.comp; gl.useProgram(Pc.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.scene.t); gl.uniform1i(u(Pc,'uScene'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, B[0].t); gl.uniform1i(u(Pc,'uBloom'), 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, B[Math.min(1,B.length-1)].t); gl.uniform1i(u(Pc,'uBloomWide'), 2);
    gl.uniform2f(u(Pc,'uTexel'), 1/sw, 1/sh); gl.uniform2f(u(Pc,'uRes'), cv.width, cv.height);
    gl.uniform1f(u(Pc,'uExposure'), S.exposure); gl.uniform1f(u(Pc,'uTime'), t); gl.uniform1f(u(Pc,'uBloomK'), 0.018);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  drawHUD(S, t);
  // ── overlays ──
  let f = 0;
  if (!STILL){ for (const c of CUTS){ const d = Math.abs(t - c); if (d < 0.4) f = Math.max(f, 1 - d/0.4); } }
  fadeEl.style.opacity = f;
  prog.style.width = Math.min(100, t/FILM_END*100) + '%';
  if (!STILL) markChapter(t);
  if (!EMBED){
    const i = CAPTIONS.findIndex(c => t >= c.a && t <= c.b);
    if (STILL){ if (i>=0){ capk.textContent = CAPTIONS[i].k; capt.textContent = CAPTIONS[i].t; cap.classList.add('on'); } }
    else if (i !== capIdx){ capIdx = i; cap.classList.remove('on'); if (i >= 0) setTimeout(()=>{ if (capIdx===i){ capk.textContent = CAPTIONS[i].k; capt.textContent = CAPTIONS[i].t; cap.classList.add('on'); } }, 400); }
  }
}

// ═════════════════════════ start-up: poster first, compile in parallel, bake once ═════════════════════════
let start = 0, paused = false, pausedAt = 0;
document.getElementById('replay').onclick = () => { start = performance.now(); capIdx = -1; };
const chapEl = document.getElementById('chapters');
CHAPTERS.slice(0, -1).forEach(c => { const b = document.createElement('button'); b.textContent = c.name; b.dataset.t = c.t; b.onclick = () => { start = performance.now() - c.t*1000; capIdx = -1; }; chapEl.appendChild(b); });
function markChapter(t){ chapEl.querySelectorAll('button').forEach(b => { const c0 = +b.dataset.t; const nx = CHAPTERS.find(c => c.t > c0); b.classList.toggle('on', t >= c0 && t < (nx ? nx.t : 1e9)); }); }
addEventListener('message', e => {
  if (e.data === 'pause' && !paused){ paused = true; pausedAt = performance.now(); }
  if (e.data === 'play' && paused){ paused = false; start += performance.now() - pausedAt; }
});
function whenReady(cb){
  const all = Object.values(P);
  (function poll(){ if (all.every(ready)) { all.forEach(check); cb(); } else requestAnimationFrame(poll); })();
}
whenReady(() => {
  bakeAll();
  document.getElementById('loading').style.opacity = 0;
  if (STILL){ render(FIXED_T); gl.finish(); cv.classList.add('ready'); cv.style.transition='none'; document.title = 'done'; return; }
  let frames = 0, acc = 0, last = performance.now(), first = true;
  start = performance.now();
  function loop(now){
    if (paused){ last = now; requestAnimationFrame(loop); return; }
    const dt = now - last; last = now;
    if (!first){ acc += dt; frames++; }
    if (frames === 8){ // aim for ~36 fps: resolution follows the measured frame time
      const ms = acc/frames, target = 33;
      if (ms > target*1.2 || (ms < target*0.6 && scale < 1.0)){
        const ns = clamp(scale*Math.sqrt(target/ms), 0.55, 1.0);
        if (Math.abs(ns-scale) > 0.03){ scale = ns; RT = null; }
      }
      frames = 0; acc = 0;
    }
    let t = (now - start)/1000;
    render(t);
    if (first){ first = false; cv.classList.add('ready'); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});
</script>
