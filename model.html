  body.embed.nolabels #labels, body.embed.nolabels #leaders { display:none; }
  @media (max-width:760px){ aside{ top:auto; height:44vh; width:auto; left:12px; right:12px; bottom:70px; } .list{max-height:20vh} header{left:16px;top:16px} footer{display:none} nav{bottom:12px} .lbl{display:none} }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ───────────────────────── renderer / scene ─────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.05, 5000);
const HOME_POS = new THREE.Vector3(7.5, 2.6, 8.5);
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3; controls.maxDistance = 40;
controls.autoRotate = true; controls.autoRotateSpeed = 0.25;
const EMBED = new URLSearchParams(location.search).has('embed');
const EMBED_LABELS = new URLSearchParams(location.search).has('labels');
if(EMBED){ document.body.classList.add('embed'); if(!EMBED_LABELS) document.body.classList.add('nolabels'); controls.enableZoom = false; controls.autoRotateSpeed = 0.35; }
function applyViewOffset(){ if(EMBED && !EMBED_LABELS){ camera.setViewOffset(innerWidth, innerHeight, -innerWidth*0.2, 0, innerWidth, innerHeight); } }
applyViewOffset();

// Sun: one hard directional source, like real orbital photography
const SUN_DIR = new THREE.Vector3(1.0, 0.55, 0.45).normalize();
const sun = new THREE.DirectionalLight(0xfff4e6, 3.6);
sun.position.copy(SUN_DIR).multiplyScalar(25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-7, right:7, top:7, bottom:-7, near:1, far:60 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
// Earthshine: weak, bluish, from below
const earthshine = new THREE.DirectionalLight(0x6f8fbf, 0.35);
earthshine.position.set(0, -10, -3);
scene.add(earthshine);

// ───────────────────────── procedural textures ─────────────────────────
function hash3(x,y,z){ let h = x*374761393 + y*668265263 + z*2147483647; h = (h ^ (h>>>13)) * 1274126177; return ((h ^ (h>>>16)) >>> 0) / 4294967295; }
function vnoise(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const L=(a,b,t)=>a+(b-a)*t;
  const c=(i,j,k)=>hash3(xi+i,yi+j,zi+k);
  return L(L(L(c(0,0,0),c(1,0,0),u),L(c(0,1,0),c(1,1,0),u),v), L(L(c(0,0,1),c(1,0,1),u),L(c(0,1,1),c(1,1,1),u),v), w);
}
function fbm(x,y,z,oct=5){ let a=0.5,f=1,s=0; for(let i=0;i<oct;i++){ s+=a*vnoise(x*f,y*f,z*f); f*=2.03; a*=0.5; } return s; }
function canvasTex(w,h,draw,srgb=true){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; draw(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}

// Crinkled multi-layer insulation (MLI) foil: bump map of random folds
const mliBump = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#808080'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){
    const x=Math.random()*w, y=Math.random()*h, a=Math.random()*Math.PI, l=20+Math.random()*90;
    g.strokeStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},${0.05+Math.random()*0.12})`;
    g.lineWidth=1+Math.random()*5;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke();
  }
  // tape seams
  g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(0,h*0.5-3,w,6); g.fillRect(w*0.5-3,0,6,h);
}, false);
mliBump.wrapS = mliBump.wrapT = THREE.RepeatWrapping;

// Solar cells: dark blue cells, silver busbars, white substrate gaps
const cellTex = canvasTex(1024,768,(g,w,h)=>{
  g.fillStyle='#d9dde2'; g.fillRect(0,0,w,h);
  const cols=16, rows=12, pad=3, cw=w/cols, ch=h/rows;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const x=i*cw+pad, y=j*ch+pad, ww=cw-2*pad, hh=ch-2*pad;
    const grd=g.createLinearGradient(x,y,x+ww,y+hh);
    const b=18+Math.random()*8; grd.addColorStop(0,`rgb(${b},${b+14},${b+48})`); grd.addColorStop(1,`rgb(${b-6},${b+6},${b+34})`);
    g.fillStyle=grd; g.fillRect(x,y,ww,hh);
    g.fillStyle='rgba(190,200,215,.55)';
    for(let k=1;k<4;k++) g.fillRect(x+ww*k/4-0.6,y,1.2,hh);
    g.fillRect(x,y+hh*0.5-0.5,ww,1);
  }
});
const cellRough = canvasTex(1024,768,(g,w,h)=>{ g.fillStyle='#2a2a2a'; g.fillRect(0,0,w,h); }, false);

// Earth: equirectangular, 3D noise sampled on the sphere so there is no seam
function earthTextures(){
  const W=1024, H=512;
  const cvC=document.createElement('canvas'); cvC.width=W; cvC.height=H;
  const cvA=document.createElement('canvas'); cvA.width=W; cvA.height=H;
  const gc=cvC.getContext('2d'), ga=cvA.getContext('2d');
  const ic=gc.createImageData(W,H), ia=ga.createImageData(W,H);
  for(let y=0;y<H;y++){
    const lat=(0.5-y/H)*Math.PI, cl=Math.cos(lat), sl=Math.sin(lat);
    for(let x=0;x<W;x++){
      const lon=x/W*Math.PI*2, px=cl*Math.cos(lon), py=sl, pz=cl*Math.sin(lon);
      const e=fbm(px*1.6+7,py*1.6+3,pz*1.6+11,6);
      const m=fbm(px*3+21,py*3+5,pz*3+2,4);
      const c=fbm(px*2.4+40,py*5.0+9,pz*2.4+17,6);
      const i=(y*W+x)*4; let r,g,b;
      const polar=Math.abs(lat)>1.22+0.08*(m-0.5);
      if(polar){ r=232;g=236;b=240; }
      else if(e>0.53){ // land
        const t=Math.min(1,(e-0.53)*6), dry=Math.max(0,1-Math.abs(lat)/0.55)*m;
        r=72+70*dry+30*t; g=82+38*dry+10*t; b=46+20*dry; }
      else { const d=(0.53-e)*4; r=10+8*(1-d); g=34+30*(1-d); b=72+40*(1-d); }
      ic.data[i]=r; ic.data[i+1]=g; ic.data[i+2]=b; ic.data[i+3]=255;
      let a=Math.max(0,Math.min(1,(c-0.5)*3.2)); a=a*a*(3-2*a);
      ia.data[i]=255; ia.data[i+1]=255; ia.data[i+2]=255; ia.data[i+3]=a*235;
    }
  }
  gc.putImageData(ic,0,0); ga.putImageData(ia,0,0);
  const tc=new THREE.CanvasTexture(cvC); tc.colorSpace=THREE.SRGBColorSpace; tc.anisotropy=8;
  const ta=new THREE.CanvasTexture(cvA); ta.colorSpace=THREE.SRGBColorSpace; ta.anisotropy=8;
  return [tc,ta];
}

// ───────────────────────── materials ─────────────────────────
const M = {
  goldMLI: new THREE.MeshStandardMaterial({ color:0xc99a3c, metalness:1, roughness:0.32, bumpMap:mliBump, bumpScale:1.2, envMapIntensity:0.6 }),
  silverMLI: new THREE.MeshStandardMaterial({ color:0xc6cacf, metalness:1, roughness:0.28, bumpMap:mliBump, bumpScale:1.0, envMapIntensity:0.6 }),
  whitePaint: new THREE.MeshStandardMaterial({ color:0xe6e6e2, metalness:0, roughness:0.62, envMapIntensity:0.3 }),
  blackAnod: new THREE.MeshStandardMaterial({ color:0x1b1c1f, metalness:0.4, roughness:0.48, envMapIntensity:0.4 }),
  alu: new THREE.MeshStandardMaterial({ color:0xb4b8bd, metalness:1, roughness:0.38, envMapIntensity:0.5 }),
  titanium: new THREE.MeshStandardMaterial({ color:0x8a8d91, metalness:1, roughness:0.45, envMapIntensity:0.5 }),
  copper: new THREE.MeshStandardMaterial({ color:0xb8754a, metalness:1, roughness:0.3, envMapIntensity:0.6 }),
  kapton: new THREE.MeshStandardMaterial({ color:0x9c5a1c, metalness:0.2, roughness:0.4, envMapIntensity:0.4 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0x0a0d14, metalness:0, roughness:0.05, clearcoat:1, clearcoatRoughness:0.03, envMapIntensity:1.0 }),
  cells: new THREE.MeshPhysicalMaterial({ map:cellTex, metalness:0.15, roughness:0.22, clearcoat:0.8, clearcoatRoughness:0.08, envMapIntensity:0.9 }),
  panelBack: new THREE.MeshStandardMaterial({ color:0xdcdcd6, metalness:0, roughness:0.75 }),
  netMesh: new THREE.MeshStandardMaterial({ color:0xd8d2c2, metalness:0, roughness:0.9 }),
  ceramic: new THREE.MeshStandardMaterial({ color:0xd8d4cc, metalness:0, roughness:0.55 }),
};

// ───────────────────────── spacecraft ─────────────────────────
const craft = new THREE.Group(); scene.add(craft);
const parts = {};   // id -> { group, base, dir, anchor, info }
function part(id, info, explodeDir, anchor){
  const g = new THREE.Group(); g.userData.part = id; craft.add(g);
  parts[id] = { group:g, base:new THREE.Vector3(), dir:explodeDir.clone(), anchor:anchor.clone(), info };
  return g;
}
function mesh(geo, mat, parent, pos=[0,0,0], rot=[0,0,0]){
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
const BX=1.8, BY=1.4, BZ=1.5;   // bus size (m): x across, y up, z along flight/front

// Bus
const bus = part('bus', {
  name:'Spacecraft bus', tag:'V1 core',
  text:'Aluminium honeycomb structure wrapped in multi-layer insulation. It houses the avionics, power electronics, propellant tank and the internal debris storage bay.',
  specs:[['Dry mass','~383 kg'],['Stowed size','2.4 × 1.8 × 1.8 m'],['Orbit','550 km SSO'],['Design life','5–7 yr']]
}, new THREE.Vector3(0,0,0), new THREE.Vector3(-BX/2, BY/2, 0));
mesh(new THREE.BoxGeometry(BX,BY,BZ), [M.goldMLI,M.goldMLI,M.silverMLI,M.goldMLI,M.goldMLI,M.goldMLI], bus);
// white radiator panels on ±y faces
mesh(new THREE.BoxGeometry(BX*0.86,0.012,BZ*0.8), M.whitePaint, bus, [0, BY/2+0.007, 0]);
mesh(new THREE.BoxGeometry(BX*0.86,0.012,BZ*0.8), M.whitePaint, bus, [0,-BY/2-0.007, 0]);
// structural edge rails
for(const sx of [-1,1]) for(const sy of [-1,1]) mesh(new THREE.BoxGeometry(0.035,0.035,BZ+0.02), M.titanium, bus, [sx*BX/2, sy*BY/2, 0]);
// RCS thruster quads on four corners
for(const sx of [-1,1]) for(const sz of [-1,1]){
  const q = new THREE.Group(); q.position.set(sx*(BX/2+0.04), -BY/2+0.12, sz*(BZ/2-0.14)); bus.add(q);
  mesh(new THREE.BoxGeometry(0.08,0.08,0.08), M.blackAnod, q);
  for(const [dx,dy,dz,rx,rz] of [[0.06,0,0,0,-Math.PI/2],[0,-0.06,0,Math.PI,0],[0,0,sz*0.06,sz*Math.PI/2,0]])
    mesh(new THREE.CylinderGeometry(0.008,0.018,0.04,12), M.titanium, q, [sx*dx,dy,dz], [rx,0,sx*rz]);
}

// Solar array wings (±x), each: yoke + 3 panels; rotate about x to track the sun
function wing(id, side){
  const g = part(id, {
    name: side>0?'Solar array wing (starboard)':'Solar array wing (port)', tag:'V1 core',
    text:'Triple-junction GaAs cells on carbon-fibre panels. The wing rotates on its drive to keep the cells facing the Sun.',
    specs:[['Cells','Triple-junction GaAs'],['Array output','1.4 kW BOL (both wings)'],['Panels','3 per wing']]
  }, new THREE.Vector3(side*1.6,0,0), new THREE.Vector3(side*4.2, 0.55, 0));
  g.position.set(side*BX/2, 0.15, 0);
  const drive = mesh(new THREE.CylinderGeometry(0.07,0.07,0.12,24), M.alu, g, [side*0.06,0,0], [0,0,Math.PI/2]);
  const pivot = new THREE.Group(); g.add(pivot); g.userData.pivot = pivot;
  // yoke rods
  for(const z of [-0.35,0.35]) mesh(new THREE.CylinderGeometry(0.012,0.012,0.95,10), M.titanium, pivot, [side*0.6,0,z*0.6], [0,side*(z>0?-0.42:0.42),Math.PI/2]);
  const PW=1.15, PL=0.95, T=0.028;
  for(let i=0;i<3;i++){
    const x = side*(1.1 + PW/2 + i*(PW+0.05));
    const panel = new THREE.Group(); panel.position.set(x,0,0); pivot.add(panel);
    mesh(new THREE.BoxGeometry(PW,T,PL), [M.panelBack,M.panelBack,M.cells,M.panelBack,M.panelBack,M.panelBack], panel);
    mesh(new THREE.BoxGeometry(PW,T*1.4,0.02), M.alu, panel, [0,0,PL/2]);
    mesh(new THREE.BoxGeometry(PW,T*1.4,0.02), M.alu, panel, [0,0,-PL/2]);
    if(i<2) for(const z of [-0.3,0.3]) mesh(new THREE.CylinderGeometry(0.014,0.014,0.06,10), M.alu, panel, [side*(PW/2+0.025),0,z], [0,0,Math.PI/2]);
  }
  return g;
}
wing('wingR', 1); wing('wingL', -1);

// High-gain antenna on a boom (top, aft)
const hga = part('hga', {
  name:'High-gain antenna', tag:'V1 core',
  text:'Steerable X-band dish for telemetry and encounter data downlink.',
  specs:[['Diameter','0.32 m (design)'],['Band','X-band'],['Downlink','150 Mbps target']]
}, new THREE.Vector3(0,1.2,-0.6), new THREE.Vector3(-0.35, BY/2+1.05, -0.5));
hga.position.set(-0.35, BY/2, -0.5);
mesh(new THREE.CylinderGeometry(0.025,0.025,0.7,12), M.titanium, hga, [0,0.35,0]);
mesh(new THREE.CylinderGeometry(0.05,0.05,0.08,20), M.blackAnod, hga, [0,0.72,0]);
const dishG = new THREE.Group(); dishG.position.set(0,0.8,0); dishG.rotation.set(-0.9,0.4,0); hga.add(dishG);
{ const pts=[]; for(let i=0;i<=24;i++){ const r=i/24*0.32; pts.push(new THREE.Vector2(r, r*r*0.9)); }
  const dish = mesh(new THREE.LatheGeometry(pts,64), M.whitePaint, dishG); dish.material = M.whitePaint.clone(); dish.material.side = THREE.DoubleSide;
  for(let k=0;k<3;k++){ const a=k*Math.PI*2/3; const s = mesh(new THREE.CylinderGeometry(0.006,0.006,0.3,6), M.titanium, dishG, [Math.cos(a)*0.15,0.2,Math.sin(a)*0.15]); s.lookAt(dishG.localToWorld(new THREE.Vector3(0,0.34,0))); s.rotateX(Math.PI/2); }
  mesh(new THREE.CylinderGeometry(0.025,0.035,0.06,16), M.blackAnod, dishG, [0,0.34,0]); }

// Front face (+z): electron beam gun with V2 phased micro-emitter array
const egun = part('egun', {
  name:'Electron beam gun', tag:'V1 core · upgraded in V2',

const highlight = new Map();
function setHighlight(id){
  for(const [m,orig] of highlight){ m.material = orig; } highlight.clear();
  if(!id) return;
  parts[id].group.traverse(o=>{ if(o.isMesh){ const orig=o.material; const mats=Array.isArray(orig)?orig:[orig];
    const hl=mats.map(mm=>{ const c=mm.clone(); if(c.emissive){ c.emissive=new THREE.Color(0xd9b36c); c.emissiveIntensity=0.22; } return c; });
    o.material = Array.isArray(orig)?hl:hl[0]; highlight.set(o,orig); } });
}
const camGoal = { target:null, pos:null };
function select(id){
  selected = (selected===id) ? null : id;
  listEl.querySelectorAll('.item').forEach(el=>el.classList.toggle('on', el.dataset.id===selected));
  setHighlight(selected);
  if(!selected){ infoEl.classList.remove('show'); return; }
  const inf = parts[selected].info;
  infoEl.innerHTML = `<div class="tag">${inf.tag}</div><h2>${inf.name}</h2><p>${inf.text}</p><table>${inf.specs.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table><div class="note">Figures are design targets unless marked as analysis.</div>`;
  infoEl.classList.add('show');
  const a = currentAnchor(selected);
  camGoal.target = a.clone();
  const off = camera.position.clone().sub(controls.target).normalize().multiplyScalar(5.5);
  camGoal.pos = a.clone().add(off);
}
function currentAnchor(id){ const p=parts[id]; return p.anchor.clone().add(p.dir.clone().multiplyScalar(explodeT)); }

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
canvas.addEventListener('pointerdown', e=>{ downAt=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup', e=>{
  if(!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1])>5) return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(craft, true)[0];
  if(!hit){ if(selected) select(selected); return; }
  let o = hit.object; while(o && !o.userData.part) o = o.parent;
  if(o) select(o.userData.part);
});

// ───────────────────────── loop ─────────────────────────
const clock = new THREE.Clock(); const tmp = new THREE.Vector3();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  earthMesh.rotation.y += dt*0.004; clouds.rotation.y += dt*0.0052;
  // solar arrays slowly track the sun
  for(const id of ['wingR','wingL']) parts[id].group.userData.pivot.rotation.x = 0.35 + Math.sin(t*0.05)*0.08;
  // exploded view
  explodeT += ((exploded?1:0) - explodeT) * Math.min(1, dt*3);
  for(const p of Object.values(parts)) p.group.position.copy(p.base).addScaledVector(p.dir, explodeT);
  // tethers
  tetherT += ((tetherOut?1:0) - tetherT) * Math.min(1, dt*0.8);
  tethers.visible = tetherT > 0.01;
  tetherLines.forEach((l,k)=>{ const a=l.geometry.attributes.position; const s=new THREE.Vector3(a.getX(0),a.getY(0),a.getZ(0)); const e=s.clone().addScaledVector(tetherDirs[k], 0.3+tetherT*60); a.setXYZ(1,e.x,e.y,e.z); a.needsUpdate=true; });
  // camera easing
  if(camGoal.target){ controls.target.lerp(camGoal.target, Math.min(1,dt*3)); if(controls.target.distanceTo(camGoal.target)<0.01) camGoal.target=null; }
  if(camGoal.pos){ camera.position.lerp(camGoal.pos, Math.min(1,dt*3)); if(camera.position.distanceTo(camGoal.pos)<0.02) camGoal.pos=null; }
  controls.update();
  renderer.render(scene, camera);
  // labels + leader lines
  let svg = '';
  for(const id of LABELED){
    const el = labelEls[id]; const vis = showLabels && (!selected || selected===id);
    tmp.copy(currentAnchor(id)).project(camera);
    if(!vis || tmp.z>1){ el.style.opacity=0; continue; }
    const x=(tmp.x*0.5+0.5)*innerWidth, y=(-tmp.y*0.5+0.5)*innerHeight;
    const right = tmp.x >= -0.05, lx = x + (right?46:-46), ly = y - 26;
    el.style.opacity = 1; el.style.left = (right? lx+6 : lx-6-el.offsetWidth)+'px'; el.style.top = ly+'px';
    svg += `<circle cx="${x}" cy="${y}" r="2" fill="rgba(255,255,255,.85)"/><polyline points="${x},${y} ${x+(right?18:-18)},${ly} ${lx},${ly}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1"/>`;
  }
  leaders.innerHTML = svg;
  requestAnimationFrame(frame);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); applyViewOffset(); renderer.setSize(innerWidth,innerHeight); });
frame();
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(()=>ld.remove(), 900);
</script>
</body>
